# XcodeGen project definition — CI runs `xcodegen generate` then xcodebuild.
# No .pbxproj in git = no merge pain; add files by just adding them to CouchKing/.
# One codebase, three platforms, ONE bundle id (universal purchase): iPhone, Apple TV, Mac.
name: CouchKing
options:
  bundleIdPrefix: app.couchking
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
    macOS: "13.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: app.couchking.ios
    PRODUCT_NAME: CouchKing
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "9DQ4PK94U6"
    SWIFT_VERSION: "5.9"
targets:
  CouchKing:
    type: application
    platform: iOS
    sources: [CouchKing]
    info:
      path: CouchKing/Info.plist
      properties:
        CFBundleDisplayName: CouchKing TV
        UILaunchScreen: {}
        # Portrait app; the PLAYER rotates to landscape (Android sensorLandscape parity).
        # All three must be declared or iOS refuses the runtime rotation.
        UISupportedInterfaceOrientations:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft,
           UIInterfaceOrientationLandscapeRight]
        "UISupportedInterfaceOrientations~ipad":
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft,
           UIInterfaceOrientationLandscapeRight]
        NSAppTransportSecurity: { NSAllowsArbitraryLoads: false }
        UIBackgroundModes: [audio]   # keep playing with screen off, like Android
        ITSAppUsesNonExemptEncryption: false   # HTTPS only = exempt; auto-clears TestFlight compliance prompt
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"   # iPhone first; iPad later
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon   # CouchKing/Assets.xcassets/AppIcon.appiconset (1024 → all sizes)

  # Apple TV — the Firestick-style leanback app (remote / focus driven). Streaming only.
  CouchKing-tvOS:
    type: application
    platform: tvOS
    sources:
      - path: CouchKing
        excludes: ["Info.plist"]   # the iOS target's generated plist lives in CouchKing/
    info:
      path: Platforms/tvOS/Info.plist
      properties:
        CFBundleDisplayName: CouchKing TV
        UILaunchScreen: {}
        NSAppTransportSecurity: { NSAllowsArbitraryLoads: false }
        UIBackgroundModes: [audio]
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false   # HTTPS only = exempt (same as iOS)
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"   # tvOS brand assets (layered icon + top shelf)

  # Mac — the desktop-app layout (resizable window, sidebar, hover, keyboard). Streaming only.
  CouchKing-macOS:
    type: application
    platform: macOS
    sources:
      - path: CouchKing
        excludes: ["Info.plist"]   # the iOS target's generated plist lives in CouchKing/
    info:
      path: Platforms/macOS/Info.plist
      properties:
        CFBundleDisplayName: CouchKing TV
        LSApplicationCategoryType: public.app-category.entertainment
        ITSAppUsesNonExemptEncryption: false   # HTTPS only = exempt (same as iOS)
        NSAppTransportSecurity: { NSAllowsArbitraryLoads: false }
    entitlements:
      path: Platforms/macOS/CouchKing.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true   # API + video streams; nothing else
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon   # shared AppIcon set carries mac idiom sizes 16–1024
