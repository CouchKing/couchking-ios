name: build
on: { push: { branches: [master, main] }, pull_request: {}, workflow_dispatch: {} }
jobs:
  compile:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -project CouchKing.xcodeproj -scheme CouchKing \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath dd CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | tail -20
      - name: Surface errors
        if: failure()
        run: grep -E "error:" build.log | sort -u | head -40
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: build-log, path: build.log }
      - name: Run in simulator + screenshots
        continue-on-error: true   # screenshots are a bonus — never block the artifacts
        run: |
          set -x
          APP=$(find dd -name "CouchKing.app" -path "*iphonesimulator*" -type d | head -1)
          echo "APP=$APP"; test -n "$APP"; ls "$APP" | head
          DT=$(xcrun simctl list devicetypes | grep -oE 'com.apple.CoreSimulator.SimDeviceType.iPhone-[0-9]+' | sort -t- -k2 -n | tail -1)
          echo "device type: $DT"
          UDID=$(xcrun simctl create ck-test "$DT")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" app.couchking.ios
          sleep 12
          xcrun simctl io "$UDID" screenshot shot-home.png
      - name: Unsigned device build (Sideloadly/AltStore-installable IPA)
        run: |
          # RELEASE config — a debug build splits into a stub + .debug.dylib + preview dylib that
          # Sideloadly rejects ("Invalid file / Guru Meditation"). Release = one clean binary.
          xcodebuild -project CouchKing.xcodeproj -scheme CouchKing \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath dd-ios CODE_SIGNING_ALLOWED=NO \
            ENABLE_DEBUG_DYLIB=NO build | tail -5
          APP=$(find dd-ios/Build/Products -name "CouchKing.app" | head -1)
          echo "app contents:"; ls "$APP"
          mkdir Payload && cp -r "$APP" Payload/
          zip -qr CouchKing-unsigned.ipa Payload
      - name: Package simulator app (drag onto Simulator on any Mac)
        run: |
          SIMAPP=$(find dd/Build/Products -name "CouchKing.app" | head -1)
          ditto -c -k --keepParent "$SIMAPP" CouchKing-Simulator.app.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: couchking-ios
          if-no-files-found: warn
          path: |
            shot-home.png
            CouchKing-unsigned.ipa
            CouchKing-Simulator.app.zip
  # TestFlight lane — signs with the App Store Connect API key (cloud-managed signing, no
  # certs/profiles to manage locally) and uploads the iPhone build to TestFlight.
  # Runs only on master pushes / manual dispatch, only when the signing secrets exist.
  testflight:
    needs: compile
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: macos-15
    env:
      KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      TEAM_ID: "9DQ4PK94U6"
    steps:
      - uses: actions/checkout@v4
      - name: Skip if no signing secrets
        id: gate
        run: |
          if [ -z "$KEY_ID" ]; then echo "no signing secrets — skipping"; echo "go=no" >> $GITHUB_OUTPUT
          else echo "go=yes" >> $GITHUB_OUTPUT; fi
      - name: Install XcodeGen
        if: steps.gate.outputs.go == 'yes'
        run: brew install xcodegen
      - name: Generate project
        if: steps.gate.outputs.go == 'yes'
        run: xcodegen generate
      - name: Install API key
        if: steps.gate.outputs.go == 'yes'
        env: { APPSTORE_P8: "${{ secrets.APPSTORE_P8 }}" }
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPSTORE_P8" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
      - name: Archive (unsigned — the export step does distribution signing)
        if: steps.gate.outputs.go == 'yes'
        run: |
          set -o pipefail
          # Archive WITHOUT signing: automatic signing during archive requests a *development*
          # profile (needs a registered device). The export step below signs for App Store
          # distribution instead, whose profiles need no device.
          xcodebuild -project CouchKing.xcodeproj -scheme CouchKing \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/CouchKing.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive 2>&1 | tee archive.log | tail -30
      - name: Export IPA
        if: steps.gate.outputs.go == 'yes'
        run: |
          set -o pipefail
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>export</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/CouchKing.xcarchive -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            2>&1 | tee export.log | tail -20
      - name: Upload to TestFlight
        if: steps.gate.outputs.go == 'yes'
        run: |
          IPA=$(find build/export -name '*.ipa' | head -1)
          echo "uploading: $IPA"
          xcrun altool --upload-app -f "$IPA" --type ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID" 2>&1 | tee upload.log | tail -25
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: testflight-logs, path: "*.log" }
  # Apple TV compile check (unsigned). Signing / TestFlight lanes are owned by the main session.
  compile-tvos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for tvOS simulator
        run: |
          set -o pipefail
          xcodebuild -project CouchKing.xcodeproj -scheme CouchKing-tvOS \
            -destination 'generic/platform=tvOS Simulator' \
            -derivedDataPath dd-tv CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-tvos.log | tail -20
      - name: Surface errors
        if: failure()
        run: grep -E "error:" build-tvos.log | sort -u | head -60
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: build-log-tvos, path: build-tvos.log }

  # Mac compile check (unsigned). Signing / TestFlight lanes are owned by the main session.
  compile-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for macOS
        run: |
          set -o pipefail
          xcodebuild -project CouchKing.xcodeproj -scheme CouchKing-macOS \
            -destination 'generic/platform=macOS' \
            -derivedDataPath dd-mac CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-macos.log | tail -20
      - name: Surface errors
        if: failure()
        run: grep -E "error:" build-macos.log | sort -u | head -60
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: build-log-macos, path: build-macos.log }
