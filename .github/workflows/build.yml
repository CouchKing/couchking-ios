name: build
on: { push: { branches: [master, main] }, workflow_dispatch: {} }
jobs:
  compile:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for simulator
        run: |
          xcodebuild -project CouchKing.xcodeproj -scheme CouchKing \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -derivedDataPath dd CODE_SIGNING_ALLOWED=NO build | tail -20
      - name: Run in simulator + screenshots
        run: |
          UDID=$(xcrun simctl list devices available | grep "iPhone 15 (" | head -1 | grep -oE '[0-9A-F-]{36}')
          xcrun simctl boot $UDID || true
          xcrun simctl bootstatus $UDID -b
          APP=$(find dd/Build/Products -name "CouchKing.app" | head -1)
          xcrun simctl install $UDID "$APP"
          xcrun simctl launch $UDID app.couchking.ios
          sleep 10
          xcrun simctl io $UDID screenshot shot-home.png
      - name: Unsigned device build (AltStore-installable IPA)
        run: |
          xcodebuild -project CouchKing.xcodeproj -scheme CouchKing \
            -destination 'generic/platform=iOS' \
            -derivedDataPath dd-ios CODE_SIGNING_ALLOWED=NO build | tail -5
          APP=$(find dd-ios/Build/Products -name "CouchKing.app" | head -1)
          mkdir Payload && cp -r "$APP" Payload/
          zip -qr CouchKing-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: couchking-ios
          path: |
            shot-home.png
            CouchKing-unsigned.ipa
  # TestFlight lane activates once the Apple Developer account + signing secrets exist.
